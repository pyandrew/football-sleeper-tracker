<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League of Ordinary Gentlemen · Keeper Tracker</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { color-scheme:dark; --bg:#141416; --card:#1c1c1f; --ink:#ececee; --muted:#9a9aa1; --line:#2c2c31; --accent:#2dd4bf; --head:#232327; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:24px 20px 8px; max-width:1100px; margin:0 auto; }
  header h1 { margin:0; font-size:24px; }
  #status { color:var(--muted); font-size:13px; margin-top:4px; }
  main { max-width:1100px; margin:0 auto; padding:0 20px 60px; }
  nav.teams { position:sticky; top:0; z-index:2; background:var(--bg); padding:10px 0; display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--line); }
  nav.teams a { padding:4px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--ink); text-decoration:none; font-size:13px; }
  nav.teams a:hover { border-color:var(--accent); }
  nav.teams { display:block; }
  nav.teams .nav-row { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:center; }
  nav.teams a.info { background:none; border-color:transparent; color:var(--accent); padding:4px 4px; }
  nav.teams a.info:hover { border-color:var(--line); }
  nav.teams .sep { width:1px; height:14px; background:var(--line); }
  nav.teams .sep-main { height:22px; background:var(--muted); margin:0 6px; opacity:.5; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-top:18px; scroll-margin-top:60px; }
  h2 { margin:0 0 10px; font-size:19px; }
  h3 { margin:18px 0 8px; font-size:15px; }
  .sub { color:var(--muted); font-weight:normal; font-size:13px; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; white-space:nowrap; }
  td:last-child, table.picks td:last-child { white-space:normal; }
  th { background:var(--head); font-weight:600; }
  .num { text-align:center; }
  .muted { color:var(--muted); }
  .pos { font-weight:700; }
  .pos-QB { color:#fc2b6d; }
  .pos-RB { color:#20ceb8; }
  .pos-WR { color:#59a7ff; }
  .pos-TE { color:#feae58; }
  .pos-K { color:#c96cff; }
  .pos-DEF { color:#bf5f40; }
  .sec-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .sec-head h2 { margin:0; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--bg); }
  .seg button { all:unset; cursor:pointer; font-size:12px; padding:4px 12px; border-radius:999px; color:var(--muted); }
  .seg button.on { background:var(--line); color:var(--ink); }
  .seg button:focus-visible { outline:2px solid var(--accent); }
  tr.cut td { border-bottom:1px dashed var(--accent); }
  .note { color:var(--muted); font-size:12px; margin:8px 0 0; }
  svg.bump { width:100%; height:auto; display:block; }
  svg.bump .grid { stroke:var(--line); }
  svg.bump .axis { fill:var(--muted); font-size:11px; }
  svg.bump .cutline { stroke:var(--accent); stroke-dasharray:4 4; opacity:.6; }
  svg.bump polyline { fill:none; stroke-width:2.5; }
  svg.bump .team-line text { font-size:12px; }
  svg.bump .team-line { transition:opacity .15s; }
  svg.bump:hover .team-line { opacity:.15; }
  svg.bump .team-line:hover { opacity:1; }
  .pos-sum { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:13px; padding:10px 8px 2px; border-top:1px solid var(--line); margin-top:2px; }
  .pos-sum .total { color:var(--muted); margin-left:auto; }
  .nfl { color:var(--muted); font-size:11px; margin-left:6px; }
  .tag { font-size:11px; padding:1px 6px; border-radius:6px; background:#fee2e2; color:#991b1b; }
  a { color:var(--accent); }
  ul.moves { list-style:none; margin:0; padding:0; max-height:360px; overflow-y:auto; }
  ul.moves li { padding:8px 0; border-bottom:1px solid var(--line); }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:20px; }

  #to-top { position:fixed; right:18px; bottom:18px; height:40px; padding:0 16px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--accent); font:600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.15); opacity:0; pointer-events:none; transition:opacity .2s; z-index:5; }
  #to-top.show { opacity:1; pointer-events:auto; }
  #to-top:hover { border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>League of Ordinary Gentlemen · Keeper Tracker</h1>
  <div id="status">Loading…</div>
</header>
<main id="app"></main>
<footer>Data comes live from Sleeper each time the page loads. Keeper costs follow the league rules in config.js.</footer>
<script src="config.js?v=18"></script>
<script src="app.js?v=18"></script>
<button id="to-top" type="button" aria-label="Back to top" title="Back to top">&uarr; Back to top</button>
<script>
  (function () {
    var b = document.getElementById("to-top");
    var onScroll = function () { b.classList.toggle("show", window.scrollY > 400); };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    b.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
  })();
</script>
</body>
</html>
